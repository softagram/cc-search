[package]
name = "cc-search"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
